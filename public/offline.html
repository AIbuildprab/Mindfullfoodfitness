<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<title>Offline | Mindfull Food Fitness</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    background: #F6F4EF; color: #0B0B0C; text-align: center;
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 22rem; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.75rem; line-height: 1.15; letter-spacing: -0.02em; margin: 20px 0 8px; }
  p { color: #5C574F; line-height: 1.5; margin: 0 0 24px; }
  button {
    background: #0B0B0C; color: #fff; border: 0; border-radius: 999px; height: 48px; padding: 0 28px;
    font: 700 15px/1 inherit; cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button:focus-visible { outline: 3px solid #86712F; outline-offset: 3px; }
  small { display: block; margin-top: 16px; color: #86712F; font-weight: 600; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You’re offline</h1>
  <p>Your plan and messages need a connection. We’ll reload as soon as you’re back online.</p>
  <button id="retry" type="button">Try again</button>
  <small id="status" role="status"></small>
</main>
<script>
  var status = document.getElementById("status");
  document.getElementById("retry").addEventListener("click", function () {
    status.textContent = navigator.onLine ? "Reconnecting…" : "Still offline.";
    if (navigator.onLine) location.reload();
  });
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
